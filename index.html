<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at 70% 25%, #b3004f 0%, transparent 35%),
        radial-gradient(circle at 65% 90%, #075cff 0%, transparent 38%),
        #211027;
}

.login-box {
    width: 300px;
    padding: 32px 38px 40px;
    border-radius: 30px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.12);
    text-align: center;
}

/* HEADING */
.heading {
    color: white;
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 20px 0;
    letter-spacing: 1px;
}

/* LOGO */
.logo {
    width: 88px;
    height: 88px;
    margin: 0 auto 38px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 48px;
}

/* INPUT */
.input-box {
    display: flex;
    align-items: center;
    border-bottom: 2px solid rgba(255,255,255,0.7);
    padding: 5px 2px;
    margin-bottom: 24px;
}

.input-box span {
    margin-right: 8px;
}

.input-box input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 13px;
}

.input-box input::placeholder {
    color: rgba(255,255,255,0.75);
}

/* BUTTON */
button {
    width: 100%;
    height: 42px;
    border: none;
    border-radius: 25px;
    color: white;
    font-weight: bold;
    letter-spacing: 3px;
    background: linear-gradient(90deg, #b0008c, #397cff);
    cursor: pointer;
}
</style>
</head>

<body>

<div class="login-box">

    <!-- Heading -->
    <div class="heading">GET 1K LIKE INSTANT</div>

    <!-- Logo -->
    <div class="logo">👤</div>

    <!-- Access Token -->
    <div class="input-box">
        <span>🔒</span>
        <input type="password" placeholder="Access Token">
    </div>

    <!-- Button -->
    <button>OPEN</button>

</div>

</body>
</html>
