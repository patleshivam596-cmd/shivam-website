<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Slice Game</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#111;
font-family:Arial,sans-serif;
color:white;
text-align:center;
overflow:hidden;
}

h1{
padding:10px;
}

#topbar{
display:flex;
justify-content:space-around;
font-size:22px;
font-weight:bold;
padding:10px;
}

#game{
width:100vw;
height:85vh;
background:#222;
position:relative;
overflow:hidden;
}

.face{
position:absolute;
width:90px;
height:90px;
border-radius:50%;
background-image:url('dead-ACPPradyuman-smiling.jpg');
background-size:cover;
background-position:center;
cursor:pointer;
box-shadow:0 0 12px rgba(255,255,255,.5);
transition:.15s;
}

#gameover{
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:black;
padding:20px;
border-radius:10px;
font-size:28px;
z-index:999;
}
</style>
</head>
<body>

<h1>FACE SLICE GAME</h1>

<div id="topbar">
<div>Score: <span id="score">0</span></div>
<div>Time: <span id="time">30</span></div>
</div>

<div id="game">
<div id="gameover"></div>
</div>

<audio id="cutSound" src="Kyu_re_madarchod___CID_Acp_Gaali_Meme__(128k).m4a"></audio>

<script>

let score = 0;
let timeLeft = 30;
let running = true;

const game = document.getElementById("game");
const scoreText = document.getElementById("score");
const timeText = document.getElementById("time");
const gameover = document.getElementById("gameover");
const sound = document.getElementById("cutSound");

function cutFace(face){

if(!face.parentNode) return;

sound.currentTime = 0;
sound.play();

score++;
scoreText.innerText = score;

face.style.transform = "scale(1.5)";
face.style.opacity = "0";

setTimeout(()=>{
face.remove();
},150);
}

function spawnFace(){

if(!running) return;

const face = document.createElement("div");
face.className = "face";

face.style.left =
Math.random() * (window.innerWidth - 100) + "px";

face.style.top =
Math.random() * (game.offsetHeight - 100) + "px";

face.addEventListener("click",()=>{
cutFace(face);
});

face.addEventListener("touchmove",()=>{
cutFace(face);
});

game.appendChild(face);

setTimeout(()=>{
if(face.parentNode){
face.remove();
}
},2000);
}

const spawnInterval =
setInterval(spawnFace,2000);

const timer =
setInterval(()=>{

timeLeft--;
timeText.innerText = timeLeft;

if(timeLeft <= 0){

running = false;

clearInterval(timer);
clearInterval(spawnInterval);

document.querySelectorAll(".face")
.forEach(face=>face.remove());

gameover.style.display = "block";
gameover.innerHTML =
"GAME OVER<br><br>Score: " + score;

}

},1000);

</script>

</body>
</html>
