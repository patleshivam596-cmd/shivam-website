<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(circle at 75% 25%, #8b173d 0%, transparent 35%),
        radial-gradient(circle at 80% 85%, #315ac7 0%, transparent 35%),
        linear-gradient(135deg, #17132d, #3b102e, #151b45);

      overflow: hidden;
    }

    /* Background glow */
    body::before {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      background: #ff315f;
      filter: blur(150px);
      opacity: 0.18;
      top: -100px;
      right: 5%;
    }

    body::after {
      content: "";
      position: absolute;
      width: 450px;
      height: 450px;
      background: #467cff;
      filter: blur(160px);
      opacity: 0.25;
      bottom: -180px;
      right: 5%;
    }

    /* Login Box */
    .login-box {
      position: relative;
      z-index: 2;

      width: 420px;
      padding: 55px 55px 50px;

      border-radius: 45px;

      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.12);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.35),
        inset 0 1px 1px rgba(255,255,255,0.12);
    }

    /* Profile Icon */
    .profile {
      width: 125px;
      height: 125px;
      margin: 0 auto 35px;

      border-radius: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.10);
    }

    .profile-icon {
      font-size: 70px;
      opacity: 0.55;
      filter: grayscale(1);
    }

    /* Input */
    .input-box {
      position: relative;
      margin-bottom: 32px;
    }

    .input-box span {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);

      font-size: 21px;
      color: white;
      opacity: 0.9;
    }

    .input-box input {
      width: 100%;
      height: 48px;

      padding: 0 5px 0 42px;

      border: none;
      outline: none;

      color: white;
      font-size: 17px;

      background: transparent;

      border-bottom: 2px solid rgba(255,255,255,0.65);
    }

    .input-box input::placeholder {
      color: white;
      opacity: 0.75;
    }

    .input-box input:focus {
      border-bottom-color: #8aa9ff;
    }

    /* Options */
    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin: 8px 0 30px;

      color: white;
      font-size: 14px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .remember input {
      width: 18px;
      height: 18px;
      accent-color: #526cff;
    }

    .forgot {
      color: white;
      text-decoration: none;
      opacity: 0.7;
      font-style: italic;
    }

    .forgot:hover {
      opacity: 1;
    }

    /* Login Button */
    .login-btn {
      width: 100%;
      height: 58px;

      border: none;
      border-radius: 25px;

      background: linear-gradient(
        100deg,
        #6b004f,
        #3d38b7,
        #527cff
      );

      color: white;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 3px;

      cursor: pointer;

      box-shadow: 0 8px 25px rgba(55, 80, 255, 0.25);

      transition: 0.3s;
    }

    .login-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(70, 100, 255, 0.4);
    }

    .login-btn:active {
      transform: scale(0.97);
    }

    /* Mobile */
    @media (max-width: 500px) {
      .login-box {
        width: 90%;
        padding: 45px 30px;
        border-radius: 35px;
      }

      .profile {
        width: 105px;
        height: 105px;
      }

      .profile-icon {
        font-size: 60px;
      }

      .options {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="profile">
      <div class="profile-icon">👤</div>
    </div>

    <form onsubmit="login(event)">

      <div class="input-box">
        <span>✉</span>
        <input
          type="email"
          id="email"
          placeholder="Email ID"
          required
        >
      </div>

      <div class="input-box">
        <span>🔒</span>
        <input
          type="password"
          id="password"
          placeholder="Password"
          required
        >
      </div>

      <div class="options">

        <label class="remember">
          <input type="checkbox" id="remember">
          <span>Remember me</span>
        </label>

        <a href="#" class="forgot">
          Forgot Password?
        </a>

      </div>

      <button class="login-btn" type="submit">
        LOGIN
      </button>

    </form>

  </div>

  <script>

    function login(event) {
      event.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (email && password) {
        alert("Login button clicked!");
      }
    }

  </script>

</body>
</html>
