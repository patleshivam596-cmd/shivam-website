<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>1K Likes Gaming</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 15% 20%,#06356b55,transparent 30%),
    radial-gradient(circle at 85% 30%,#7a004855,transparent 32%),
    linear-gradient(145deg,#05060b,#090b14 55%,#030409);
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background-image:
    linear-gradient(#ffffff08 1px,transparent 1px),
    linear-gradient(90deg,#ffffff08 1px,transparent 1px);
  background-size:42px 42px;
}

/* NAVBAR */
.nav{
  height:68px;
  padding:0 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#07080dcc;
  border-bottom:1px solid #ffffff12;
  backdrop-filter:blur(15px);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  letter-spacing:2px;
}

.logoIcon{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:linear-gradient(135deg,#00baff,#743cff);
  box-shadow:0 0 20px #007dff66;
}

.online{
  color:#7d8495;
  font-size:9px;
  letter-spacing:2px;
}

.online i{
  display:inline-block;
  width:7px;
  height:7px;
  margin-right:6px;
  border-radius:50%;
  background:#00e79a;
  box-shadow:0 0 10px #00e79a;
}

/* HERO */
.hero{
  text-align:center;
  padding:48px 20px 25px;
}

.badge{
  display:inline-block;
  padding:7px 14px;
  border:1px solid #00bfff44;
  border-radius:30px;
  color:#65d9ff;
  background:#00aaff0b;
  font-size:9px;
  letter-spacing:3px;
  margin-bottom:18px;
}

.hero h1{
  font-size:clamp(48px,14vw,78px);
  line-height:.9;
  font-style:italic;
  font-weight:1000;
  letter-spacing:-4px;
}

.hero h1 span{
  background:linear-gradient(90deg,#00d9ff,#7955ff,#ff3d86);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  margin-top:17px;
  color:#737b8e;
  font-size:12px;
}

/* CARD */
.card{
  width:min(92%,460px);
  margin:20px auto 45px;
  padding:24px;

  background:linear-gradient(
    145deg,
    #151a29e8,
    #080a12f5
  );

  border:1px solid #ffffff14;
  border-radius:24px;

  box-shadow:
    0 25px 70px #000b,
    0 0 45px #006eff12;

  backdrop-filter:blur(20px);
}

/* CARD TOP */
.cardTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.cardTop span:first-child{
  color:#777f92;
  font-size:10px;
  letter-spacing:2px;
}

.active{
  padding:5px 9px;
  border-radius:6px;
  color:#00e29a;
  background:#00e29a0d;
  border:1px solid #00e29a22;
  font-size:8px;
  letter-spacing:1px;
}

/* COUNTER */
.counter{
  padding:23px;
  text-align:center;
  border-radius:18px;
  background:linear-gradient(135deg,#009dff0e,#8b4cff0c);
  border:1px solid #009dff25;
}

.likeIcon{
  font-size:32px;
  filter:drop-shadow(0 0 12px #00bfff);
}

.number{
  margin-top:5px;
  font-size:47px;
  font-weight:900;
  letter-spacing:-2px;
}

.likesText{
  color:#687286;
  font-size:9px;
  letter-spacing:5px;
}

/* PROGRESS */
.progressInfo{
  display:flex;
  justify-content:space-between;
  margin:20px 0 7px;
  color:#737b8d;
  font-size:9px;
}

.progress{
  height:5px;
  background:#1b2030;
  border-radius:10px;
  overflow:hidden;
}

.progressBar{
  width:100%;
  height:100%;
  background:linear-gradient(90deg,#00c8ff,#754cff,#ff3980);
  box-shadow:0 0 12px #008cff;
}

/* INPUT */
.field{
  margin-top:23px;
}

.fieldHeader{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}

.fieldHeader span:first-child{
  color:#aeb6c7;
  font-size:10px;
  letter-spacing:1.5px;
}

.demo{
  color:#555e72;
  font-size:8px;
}

.inputBox{
  position:relative;
}

.inputBox .lock{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  opacity:.6;
}

input{
  width:100%;
  height:52px;
  padding:0 44px;

  color:white;
  background:#05070d;

  border:1px solid #252b3a;
  border-radius:12px;
  outline:none;

  font-size:13px;
  transition:.2s;
}

input:focus{
  border-color:#008cff;
  box-shadow:0 0 0 3px #008cff12;
}

input.error{
  border-color:#ff3e62;
  box-shadow:0 0 0 3px #ff315412;
}

/* EYE */
.eye{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  color:#667085;
  cursor:pointer;
}

/* BUTTON */
.open{
  width:100%;
  height:55px;
  margin-top:18px;

  border:0;
  border-radius:13px;

  color:white;
  background:linear-gradient(90deg,#008cff,#654cff,#bd2fff);

  font-size:12px;
  font-weight:900;
  letter-spacing:3px;

  cursor:pointer;
  box-shadow:0 12px 30px #4b54ff2b;
  transition:.2s;
}

.open:hover{
  transform:translateY(-2px);
  filter:brightness(1.12);
}

.open:active{
  transform:scale(.98);
}

/* MESSAGE */
.message{
  display:none;
  margin-top:13px;
  padding:12px;
  text-align:center;
  border-radius:10px;
  font-size:10px;
  letter-spacing:1px;
}

.message.warning{
  display:block;
  color:#ffbf55;
  background:#ffae0010;
  border:1px solid #ffae0030;
}

.message.success{
  display:block;
  color:#00dfa0;
  background:#00dfa00d;
  border:1px solid #00dfa030;
}

/* FEATURES */
.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:20px;
}

.feature{
  padding:13px 5px;
  text-align:center;
  border:1px solid #ffffff09;
  background:#ffffff03;
  border-radius:12px;
}

.feature b{
  display:block;
  font-size:17px;
  margin-bottom:5px;
}

.feature span{
  color:#656e82;
  font-size:7px;
  letter-spacing:1px;
}

/* FOOTER */
footer{
  text-align:center;
  padding-bottom:30px;
  color:#424a5b;
  font-size:8px;
  letter-spacing:2px;
}

@media(max-width:480px){
  .card{
    padding:19px;
  }

  .hero{
    padding-top:40px;
  }

  .number{
    font-size:42px;
  }
}
</style>
</head>

<body>

<nav class="nav">

  <div class="logo">
    <div class="logoIcon">⚡</div>
    LIKEBOOST
  </div>

  <div class="online">
    <i></i>SYSTEM ONLINE
  </div>

</nav>


<section class="hero">

  <div class="badge">
    GAMING REWARD SYSTEM
  </div>

  <h1>
    GET <span>1K</span><br>LIKES
  </h1>

  <p>Fast • Simple • Mobile Optimized</p>

</section>


<div class="card">

  <div class="cardTop">
    <span>REWARD STATUS</span>
    <div class="active">● ACTIVE</div>
  </div>


  <div class="counter">

    <div class="likeIcon">👍</div>

    <div class="number">1,000</div>

    <div class="likesText">LIKES</div>

  </div>


  <div class="progressInfo">
    <span>REWARD PROGRESS</span>
    <span>100%</span>
  </div>

  <div class="progress">
    <div class="progressBar"></div>
  </div>


  <div class="field">

    <div class="fieldHeader">
      <span>🔒 ACCESS TOKEN</span>
      <span class="demo">DEMO UI</span>
    </div>

    <div class="inputBox">

      <span class="lock">🔒</span>

      <input
        id="token"
        type="password"
        placeholder="Enter access token"
        autocomplete="off"
      >

      <button
        class="eye"
        type="button"
        onclick="toggleToken()">
        ◉
      </button>

    </div>

  </div>


  <button
    class="open"
    type="button"
    onclick="openReward()">

    OPEN REWARD

  </button>


  <div id="message" class="message"></div>


  <div class="features">

    <div class="feature">
      <b>🛡️</b>
      <span>SECURE UI</span>
    </div>

    <div class="feature">
      <b>⚡</b>
      <span>FAST ACCESS</span>
    </div>

    <div class="feature">
      <b>●</b>
      <span>ONLINE</span>
    </div>

  </div>

</div>


<footer>
  LIKEBOOST • DEMO INTERFACE • 2026
</footer>


<script>

function toggleToken(){

  const input = document.getElementById("token");

  input.type =
    input.type === "password"
    ? "text"
    : "password";
}


function openReward(){

  const input =
    document.getElementById("token");

  const message =
    document.getElementById("message");


  /* EMPTY TOKEN */

  if(input.value.trim() === ""){

    input.classList.add("error");

    message.className =
      "message warning";

    message.innerHTML =
      "⚠ PLEASE ENTER YOUR ACCESS TOKEN FIRST";

    input.focus();

    return;
  }


  /* TEXT ENTERED — DEMO ONLY */

  input.classList.remove("error");

  message.className =
    "message success";

  message.innerHTML =
    "✓ SUCCESS — ACCESS TOKEN FIELD COMPLETED";

}

</script>

</body>
</html>
