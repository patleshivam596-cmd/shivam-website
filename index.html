<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(circle at 75% 25%, #8b173d 0%, transparent 35%),
        radial-gradient(circle at 80% 85%, #315ac7 0%, transparent 35%),
        linear-gradient(135deg, #17132d, #3b102e, #151b45);

      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      background: #ff315f;
      filter: blur(150px);
      opacity: 0.18;
      top: -100px;
      right: 5%;
    }

    body::after {
      content: "";
      position: absolute;
      width: 450px;
      height: 450px;
      background: #467cff;
      filter: blur(160px);
      opacity: 0.25;
      bottom: -180px;
      right: 5%;
    }

    .login-box {
      position: relative;
      z-index: 2;

      width: 420px;
      padding: 55px;

      border-radius: 45px;

      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.12);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.35),
        inset 0 1px 1px rgba(255,255,255,0.12);
    }

    .profile {
      width: 125px;
      height: 125px;
      margin: 0 auto 45px;

      border-radius: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      background: rgba(255,255,255,0.12);
    }

    .profile-icon {
      font-size: 70px;
      opacity: 0.55;
    }

    .input-box {
      position: relative;
      margin-bottom: 35px;
    }

    .input-box span {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);

      font-size: 21px;
      color: white;
    }

    .input-box input {
      width: 100%;
      height: 50px;

      padding: 0 5px 0 42px;

      border: none;
      outline: none;

      color: white;
      font-size: 17px;

      background: transparent;

      border-bottom: 2px solid rgba(255,255,255,0.65);
    }

    .input-box input::placeholder {
      color: white;
      opacity: 0.75;
    }

    .input-box input:focus {
      border-bottom-color: #8aa9ff;
    }

    .login-btn {
      width: 100%;
      height: 58px;

      border: none;
      border-radius: 25px;

      background: linear-gradient(
        100deg,
        #6b004f,
        #3d38b7,
        #527cff
      );

      color: white;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 3px;

      cursor: pointer;

      transition: 0.3s;
    }

    .login-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(70, 100, 255, 0.4);
    }

    .login-btn:active {
      transform: scale(0.97);
    }

    @media (max-width: 500px) {
      .login-box {
        width: 90%;
        padding: 45px 30px;
        border-radius: 35px;
      }

      .profile {
        width: 105px;
        height: 105px;
      }

      .profile-icon {
        font-size: 60px;
      }
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="profile">
      <div class="profile-icon">👤</div>
    </div>

    <form onsubmit="login(event)">

      <!-- Only Password -->
      <div class="input-box">
        <span>🔒</span>

        <input
          type="password"
          id="password"
          placeholder="Access Token"
          required
        >
      </div>

      <button class="login-btn" type="submit">
          OPEN
      </button>

    </form>

  </div>

  <script>

    function login(event) {
      event.preventDefault();

      const password =
        document.getElementById("password").value;

      if (password) {
        alert("Login button clicked!");
      }

    }

  </script>

</body>
</html>
